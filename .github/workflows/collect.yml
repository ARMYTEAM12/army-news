name: 육군뉴스 자동 수집

on:
  schedule:
    # 한국시간 06:50 ~ 23:50 매시간 (GitHub 시각은 UTC라 9시간 빼서 적음)
    - cron: "50 21-23 * * *"
    - cron: "50 0-14 * * *"
  workflow_dispatch: {}   # Actions 화면의 'Run workflow' 버튼으로 지금 바로 수집

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스·날씨 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python scripts/collect.py

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "army-news-bot"
          git config user.email "army-news-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "뉴스 자동 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
            git push
          fi
